name: APK Derle

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v3

      - name: Debug APK derle
        run: ./gradlew assembleDebug --no-daemon

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: DroneCamera-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: APK'yi kopyala ve adlandir
        run: cp app/build/outputs/apk/debug/app-debug.apk DroneKamera.apk

      - name: Release olustur ve APK ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: "Drone Kamera - Son Sürüm"
          body: |
            En güncel APK. Telefonundan **DroneKamera.apk** dosyasına dokunarak indir ve kur.
          files: DroneKamera.apk
          make_latest: true
